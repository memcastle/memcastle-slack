name: 📦 Publish release

on:
  push:
    tags:
      - 'slack/v*'

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate release
    uses: ./.github/workflows/ci.yaml

  publish:
    name: 🚀 Publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: memcastle/memcastle@main
        with:
          version: main
      - name: Require a reviewed version tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(memcastle plugin inspect --json | jq -r '.plugin | "\(.id)/v\(.version)"')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo '::error::tag does not match plugin.toml'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::tag must be on main'; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo '::error::release already exists; publish a new version tag'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
      - name: Publish this provider's validated archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          archive="dist/${tag%/v*}-${tag##*/v}.tar.gz"
          test -s "$archive"
          checksum="${archive%.tar.gz}.sha256sum"
          test -s "$checksum"
          gh release create "$tag" "$archive" "$checksum" --generate-notes
