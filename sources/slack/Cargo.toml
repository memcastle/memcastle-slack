[package]
name = "slack"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Independent workspace: this module builds inside a provider monorepo or alone.
[workspace]
